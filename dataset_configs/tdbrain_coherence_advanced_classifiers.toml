# TD-BRAIN coherence analysis with classical and graph-neural classification.
# This profile is classification-focused; it does not make a neural classifier
# an optimization objective.
dataset_root = "D:/university/projects/graph-opt/tbdbrain/TDBRAIN_Dataset_V3_1/output/preprocessed_tdbrain_restEC_set2"
healthy_subdirectory = "Healthy"
patient_subdirectory = "MDD"

output_directory = "./results-advanced-classifiers/results-TDBRAIN-restEC-coherence"
optimization_output_subdirectory = "optimization-not-run"
optimization_debug_subject = "sub-88064657"

[connectivity]
methods = ["coh"]
selected_method = "coh"
normalization = "none"
error_policy = "raise"
spectral_input = "band_filtered"
n_jobs = 4

[classification]
source = "connectivity_edges"
models = ["logistic_l2", "rbf_svm", "gcn", "brainnetcnn"]
screen_repeats = 1
validation_repeats = 5
# Neural fits are CPU-based and manage their own batches.
n_jobs = 1
minimum_roc_auc = 0.70
minimum_balanced_accuracy = 0.65
maximum_brier = 0.25

[optimization]
objective_mode = "distance_to_gt"
patient_rejection_percent = 0
n_jobs = 4
stimulation_amplitude_bounds = [-3.0, 3.0]

[optimization_measures_by_band]
delta = ["char_path_length", "diameter", "transitivity"]
alpha = ["local_efficiency", "global_efficiency", "char_path_length"]
beta = ["median_weight", "std_weight", "diameter"]
