# First-paper eyes-closed coherence classifier experiment: enhancement-only
# stimulation and no patient rejection. Its output tree is isolated from the
# signed, 50%-rejection experiment.
dataset_root = "D:/university/projects/graph-opt/paper-data/EC/set2"
healthy_subdirectory = "HC"
patient_subdirectory = "MDD"
output_directory = "./results-first-paper-coherence-enhancement-no-rejection"
# Deliberately short: longer scientific labels exceed Windows MAX_PATH once
# nested figure names are appended.
optimization_output_subdirectory = "opt-clfprob-trust-enh-norej"
optimization_debug_subject = "MDD S2  EC"

[connectivity]
methods = ["coh"]
selected_method = "coh"
normalization = "none"
error_policy = "raise"
spectral_input = "band_filtered"
n_jobs = 4

[classification]
source = "connectivity_edges"
models = ["logistic_l2", "linear_svm_sigmoid", "rbf_svm", "extra_trees"]
screen_repeats = 1
validation_repeats = 5
n_jobs = 4

[optimization]
objective_mode = "classifier_patient_probability"
classifier_model_directory = "data/connectivity_classifiers/models"
patient_ranking_template = "connectivity_classifiers/classifier_patient_ranking_{band}.csv"
patient_rejection_percent = 0
n_jobs = 4
stimulation_amplitude_bounds = [0.1, 3.0]

# Required by the shared configuration schema and still available for legacy
# graph reports. These measures are NOT optimization objectives when
# objective_mode = "classifier_patient_probability".
[optimization_measures_by_band]
delta = ["cv_weight", "min_weight", "small_worldness"]
alpha = ["min_weight", "transitivity", "clustering_coefficient"]
beta = ["cv_weight", "diameter", "modularity"]
